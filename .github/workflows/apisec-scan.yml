name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # Memungkinkan Anda menjalankan langsung dari tab Actions di GitHub

jobs:
  pypi-publish:
    name: Build and publish Python 🐍 distribution 📦 to PyPI
    runs-on: ubuntu-latest
    permissions:
      # PENTING: Permission ini wajib untuk PyPI Trusted Publishing (OIDC)
      id-token: write
      contents: read

    environment:
      name: pypi
      url: https://pypi.org/p/joomha

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build binary wheel and source tarball
        run: |
          python -m build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
